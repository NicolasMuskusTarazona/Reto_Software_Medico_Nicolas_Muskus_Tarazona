paciente:
  class: sfDoctrineRouteCollection
  options:
    model:                Paciente
    module:               pacientes
    prefix_path:          /pacientes
    column:               id
    with_wildcard_routes: true

doctor:
  class: sfDoctrineRouteCollection
  options:
    model:                Doctor
    module:               doctor
    prefix_path:          /doctor
    column:               id
    with_wildcard_routes: true

cita:
  class: sfDoctrineRouteCollection
  options:
    model:                Cita
    module:               citas
    prefix_path:          /citas
    column:               id
    with_wildcard_routes: true

# You can find more information about this file on the symfony website:
# http://www.symfony-project.org/reference/1_4/en/10-Routing

# default rules
homepage:
  url:   /
  param: { module: default, action: index }

# generic rules
# please, remove them by adding more specific rules
default_index:
  url:   /:module
  param: { action: index }

default:
  url:   /:module/:action/*